# sbt 1.x is pinned deliberately.
#
# The machine has sbt 2.0.4 installed, but sbt 2 uses Scala 3 for build
# definitions and its plugin ecosystem for Spark work is not yet settled.
# sbt reads this file and downloads the requested launcher version itself, so
# pinning 1.9.9 here costs nothing and keeps the build on the well-trodden path
# for Scala 2.12 / Spark artifacts.
sbt.version=1.9.9
